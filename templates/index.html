<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Railway Delay Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>body{font-family:sans-serif;max-width:900px;margin:2rem auto}</style>
</head>
<body>
  <h1>Railway Delay Dashboard</h1>
  <label>Year <input id="year" type="number" value="2025"></label>
  <label>Month <select id="month"></select></label>
  <button onclick="load()">Load</button>

  <h2>Monthly average delay</h2>
  <canvas id="m"></canvas>
  <h2>Weekly average delay (<span id="monthName"></span>)</h2>
  <canvas id="w"></canvas>

<script>
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const sel = document.getElementById("month"); 
for (let i = 1; i <= 12; i++) sel.add(new Option(MONTHS[i-1], i, false, i === 1));
let mc, wc;

async function load() {
  const y = document.getElementById("year").value, mo = sel.value;
  document.getElementById("monthName").textContent = `${MONTHS[mo-1]} ${y}`;  // <- this one too
  const m = await (await fetch(`/api/monthly?year=${y}`)).json();
  const w = await (await fetch(`/api/weekly?year=${y}&month=${mo}`)).json();
  if (mc) mc.destroy(); if (wc) wc.destroy();
  mc = new Chart("m", {type: "line", data: {
    labels: m.map(r => MONTHS[r.month_num - 1]),
    datasets: [{label: "Avg delay (min)", data: m.map(r => r.avg_delay_min)}]}});
  wc = new Chart("w", {type: "bar", data: {
    labels: w.map(r => "Wk " + r.iso_week),
    datasets: [{label: "Avg delay (min)", data: w.map(r => r.avg_delay_min)}]}});
}
load();
</script>
</body>
</html>
